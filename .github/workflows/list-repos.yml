name: List Repos
on: [workflow_dispatch]
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Get repos
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/user/repos?per_page=100 | python3 -c "import sys, json; repos = json.load(sys.stdin); print('\n'.join([f\"{r['name']} ({r['stargazers_count']} ⭐)\" for r in sorted(repos, key=lambda x: x['name'])]))"
